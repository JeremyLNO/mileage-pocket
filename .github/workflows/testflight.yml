name: TestFlight Release

# Auto-publishes every push to main to TestFlight. Requires 5 repo secrets
# (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID              — App Store Connect API Key ID
#   ASC_ISSUER_ID           — App Store Connect API Issuer ID
#   ASC_KEY_P8              — full contents of the AuthKey_<id>.p8 file
#   IOS_DEV_CERT_P12        — base64 of an exported "Apple Development" .p12
#   IOS_DEV_CERT_PASSWORD   — the password that .p12 was exported with
# The API key comes from App Store Connect → Users and Access → Integrations
# → App Store Connect API (NOT an APNs key — different key, same portal
# family). xcodebuild archive with automatic signing always wants an "Apple
# Development" identity for the archive step itself (distribution signing
# happens later, during export/upload, driven by the API key) — so that's
# the cert imported into a throwaway keychain every run, reused instead of
# minting a brand new one each time (GitHub's runners are ephemeral; doing
# that repeatedly silently exhausts the account's certificate quota).
#
# ⚠️ This repository is PRIVATE, so macOS runner minutes are billed at the
# ×10 multiplier — unlike the other iOS repos, which are public on purpose.
# Set the repo variable SKIP_TESTFLIGHT=true to park the pipeline without
# deleting it.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Archive & upload to TestFlight
    runs-on: xcode-27
    timeout-minutes: 45
    if: ${{ vars.SKIP_TESTFLIGHT != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Regenerate Xcode project
        # Same step release.sh runs before archiving: the pbxproj is generated,
        # so a source file added without re-running the generator would be
        # missing from the archive while the build still succeeds.
        run: python3 gen_pbxproj.py

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        # Two copies on purpose: xcodebuild is pointed at ~/private_keys, while
        # tools/next_build_number.py reads the fixed ~/.appstoreconnect path it
        # uses on the Mac. Writing both keeps that script untouched.
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/

      - name: Import signing certificates
        # Les deux, Distribution compris. Le projet est en signature MANUELLE avec
        # CODE_SIGN_IDENTITY = "Apple Distribution" : sans ce certificat, l'archive
        # s'arrête sur « No signing certificate "iOS Distribution" found ». Les
        # certificats sont réutilisés et jamais recréés — un profil se recrée
        # gratuitement, un certificat compte dans le quota du compte et le sature.
        env:
          DEV_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          DEV_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
          DIST_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          DIST_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          import_cert() {
            local payload="$1" password="$2" label="$3"
            if [ -z "$payload" ]; then
              echo "::warning::no $label certificate in secrets, skipping"
              return
            fi
            echo "$payload" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            if security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$password" \
              -T /usr/bin/codesign -T /usr/bin/security; then
              echo "imported $label certificate"
            else
              echo "::warning::could not import the $label certificate (wrong password or bad p12 secret)"
            fi
            rm -f "$RUNNER_TEMP/cert.p12"
          }
          import_cert "$DIST_P12" "$DIST_PASSWORD" distribution
          import_cert "$DEV_P12" "$DEV_PASSWORD" development

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          # Sans ça, la signature automatique ne voit pas les identités qu'on vient
          # d'importer et fabrique un nouveau certificat à chaque run, ce qui sature
          # le quota du compte et casse l'archive de TOUTES les apps.
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "--- signing identities available ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          # L'import est volontairement non fatal : c'est ce dump qui fait foi.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Develop" || {
            echo "::error::aucune identité de signature utilisable dans le trousseau"
            exit 1
          }

      - name: Resolve Swift packages
        # Résolu à part, avec son propre chrono. Une résolution qui se bloque
        # *dans* `xcodebuild archive` n'a aucun timeout à elle : le 2026-09-14,
        # trois dépôts sont restés figés juste après « Checking out 5.5.1 of
        # package OneSignal-XCFramework » et GitHub ne les a tués qu'au bout de
        # SIX heures. Ici, ça échoue en 10 minutes et ça se voit.
        timeout-minutes: 10
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MileagePocket.xcodeproj \
            -scheme MileagePocket

      - name: Compute build number
        env:
          # Le dépôt est public : l'issuer ID n'est plus en dur dans le script,
          # il arrive par cette variable (le .p8, lui, est déjà écrit sur disque
          # par l'étape précédente, à l'emplacement que le script attend).
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # tools/next_build_number.py signe un JWT ES256 : il lui faut pyjwt et
        # cryptography, absents du runner. Dans un venv plutôt qu'en pip système,
        # que les images macOS refusent (externally-managed-environment).
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography
          BUILD_NUMBER=$("$RUNNER_TEMP/venv/bin/python" tools/next_build_number.py)
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::next_build_number.py n'a pas rendu un entier : '$BUILD_NUMBER'"
              exit 1
              ;;
          esac
          echo "Build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Archive (signed, automatic provisioning)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # BUILD_NUMBER vient de l'étape précédente : tools/next_build_number.py,
        # celui qu'utilise déjà release.sh depuis ce Mac. Il rend
        # max(AAMMJJHHMM, plus_haut_build+1) en lisant le plancher dans App Store
        # Connect. Surtout ne PAS le remplacer par le compteur « minutes depuis
        # 2023 » des autres apps : il vaut ~1 491 000, très en dessous des numéros
        # déjà en ligne ici (2 609 151 542), et TestFlight trie par NUMÉRO, pas
        # par date d'upload — le nouveau build serait invisible derrière l'ancien.
        #
        # ⚠️ Aucun commentaire `#` à l'intérieur des commandes ci-dessous : le
        # shell coupe la commande au premier `#`, et xcodebuild partirait sans
        # clé ASC ni numéro de build.
        run: |
          archive() {
            xcodebuild archive \
              -project MileagePocket.xcodeproj \
              -scheme MileagePocket \
              -disableAutomaticPackageResolution \
              -configuration Release \
              -archivePath build/MileagePocket.xcarchive \
              -destination 'generic/platform=iOS' \
              -allowProvisioningUpdates \
              CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="Apple Development" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          }
          # First run downloads/creates any missing provisioning profiles (esp.
          # for the widget extension) — occasionally the build plan is computed
          # just before that download lands on disk, failing with "Build input
          # file cannot be found: .../<uuid>.mobileprovision". A second attempt
          # always finds the file already there and succeeds.
          archive || { echo "Retrying archive (profile likely just landed)…"; archive; }

      - name: Export & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # ExportOptions.plist du dépôt est en signingStyle=manual avec deux profils
        # nommés — ils existent sur le Mac, pas sur un runner éphémère. La CI
        # travaille sur une copie basculée en automatique, que -allowProvisioningUpdates
        # et la clé ASC savent résoudre seules. Une copie, pas un second fichier :
        # deux plists finiraient par diverger sans que rien ne le signale.
        run: |
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions-ci.plist"
          /usr/libexec/PlistBuddy -c "Set :signingStyle automatic" "$RUNNER_TEMP/ExportOptions-ci.plist"
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles" "$RUNNER_TEMP/ExportOptions-ci.plist" || true
          xcodebuild -exportArchive \
            -archivePath build/MileagePocket.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-ci.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
